# XcodeGen 工程描述：`xcodegen generate` 生成 Baccarat.xcodeproj
# brew install xcodegen
name: Baccarat
options:
  bundleIdPrefix: com.yourco
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # 填你的 Team ID（或在 Xcode 里选）
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # H5 地址：编译期写入 Info.plist（xcodebuild ... H5_URL=https://game.yourdomain.com 可覆盖）
    H5_URL: "https://baccarat.yytbank.cn"
targets:
  Baccarat:
    type: application
    platform: iOS
    sources:
      - path: Baccarat/Sources
      - path: Baccarat/Resources
    info:
      path: Baccarat/Info.plist
      properties:
        CFBundleDisplayName: 百家乐
        CFBundleName: Baccarat
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        H5URL: "$(H5_URL)"
        # 开发期允许 http；生产全 https 后删掉这一段
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 视频客服需要使用摄像头
        NSMicrophoneUsageDescription: 语音客服需要使用麦克风
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.baccarat
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: false
