# 已有 Nginx 上新增的站点：/etc/nginx/conf.d/baccarat.conf（或 sites-available 里）
# 证书：sudo certbot --nginx -d baccarat.yytbank.cn   （certbot 会自动补上 443 段）
# 然后：sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name baccarat.yytbank.cn;

    # WebRTC WHEP/WHIP 信令 → SRS
    location /rtc/ {
        proxy_pass http://127.0.0.1:11985;
        proxy_set_header Host $host;
    }
    # HLS 兜底 → SRS
    location /live/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
    }
    # H5 / API / WebSocket → 游戏服务端
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket 长连接
    }
}
