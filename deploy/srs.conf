# SRS 5：WebRTC(WHIP/WHEP) + RTMP 转 WebRTC + HLS 兜底
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;    # OBS RTMP 推流也能被 WHEP 拉
        rtc_to_rtmp on;
    }
    hls {
        enabled     on;
        hls_fragment 1;
        hls_window  6;
    }
    play {
        gop_cache   off;   # 低延迟
    }
}
